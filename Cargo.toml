[package]
name = "llm-leaders"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comfy-table = { version = "7", features = ["tty"] }
inquire = "0.7"
anyhow = "1"
dirs = "6"
regex = "1"

[profile.release]
strip = true
lto = true
